<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>Анкета — старт заявки</title>
    <meta name="description" content="Анкета для старта сопровождения официального восстановления доступа к Apple ID/iCloud." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="bg">
      <div class="bg__grid"></div>
      <div class="bg__glow"></div>
    </div>

    <header class="container header">
      <a class="brand" href="./index.html" aria-label="Home">
        <span class="brand__mark"></span>
        <span class="brand__name">iCloud Support</span>
      </a>

      <div class="header__right">
        <button class="lang" type="button" id="langToggle" aria-label="Switch language">
          <span class="lang__pill" id="langPill">RU</span>
        </button>
      </div>
    </header>

    <main class="container section">
      <div class="card formCard">
        <div class="formCard__top">
          <div class="kicker" data-i18n="intake.kicker">Шаг 2 из 2</div>
          <h1 class="h2" data-i18n="intake.title">Анкета для старта</h1>
          <p class="muted" data-i18n="intake.lead">
            Заполните данные. Мы используем их только для сопровождения официального восстановления доступа.
          </p>
        </div>

        <div class="banner" id="paymentBanner" hidden>
          <div class="banner__title" data-i18n="intake.paidTitle">Оплата подтверждена</div>
          <div class="banner__text muted">
            <span data-i18n="intake.paidText">Номер заявки</span>:
            <span class="mono" id="ticketId">—</span>
            <span class="muted"> • </span>
            <span class="muted" id="paidVia">—</span>
          </div>
        </div>

        <form id="intakeForm" class="form">
          <div class="grid2">
            <div class="field">
              <label class="label" for="email" data-i18n="intake.email">Email</label>
              <input class="input" id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" />
            </div>
            <div class="field">
              <label class="label" for="phone" data-i18n="intake.phone">Телефон</label>
              <input class="input" id="phone" name="phone" type="tel" placeholder="+7 ..." autocomplete="tel" />
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label class="label" for="region" data-i18n="intake.region">Регион</label>
              <input class="input" id="region" name="region" type="text" placeholder="RU / KZ / UA / ..." />
            </div>
            <div class="field">
              <label class="label" for="device" data-i18n="intake.device">Устройство</label>
              <input class="input" id="device" name="device" type="text" placeholder="iPhone 12 / iPad / MacBook..." />
            </div>
          </div>

          <div class="grid2">
            <div class="field">
              <label class="label" for="caseType" data-i18n="intake.caseType">Ситуация</label>
              <select class="input" id="caseType" name="caseType">
                <option value="forgot" data-i18n="intake.case.forgot">Забыл пароль/нет доступа</option>
                <option value="2fa" data-i18n="intake.case.2fa">Проблема с 2FA/номером</option>
                <option value="locked" data-i18n="intake.case.locked">Аккаунт заблокирован/disabled</option>
                <option value="other" data-i18n="intake.case.other">Другое</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="proof" data-i18n="intake.proof">Подтверждение владения</label>
              <select class="input" id="proof" name="proof">
                <option value="receipt" data-i18n="intake.proof.receipt">Есть чек/инвойс</option>
                <option value="box" data-i18n="intake.proof.box">Есть коробка/серийники</option>
                <option value="none" data-i18n="intake.proof.none">Нет подтверждения</option>
              </select>
            </div>
          </div>

          <div class="field">
            <label class="label" for="details" data-i18n="intake.details">Детали</label>
            <textarea
              class="input textarea"
              id="details"
              name="details"
              placeholder="Коротко: что произошло, что помните по аккаунту, какие шаги уже пробовали…"
              rows="6"
            ></textarea>
          </div>

          <label class="check">
            <input type="checkbox" id="ownerConfirm" required />
            <span data-i18n="intake.ownerConfirm">
              Подтверждаю, что я владелец устройства/аккаунта и не запрашиваю обход защитных механизмов
            </span>
          </label>

          <div class="row row--end">
            <a class="btn btn--ghost" href="./index.html" data-i18n="intake.back">Назад</a>
            <button class="btn btn--primary" type="submit" id="submitBtn" data-i18n="intake.submit">Отправить анкету</button>
          </div>

          <div class="status" id="formStatus" aria-live="polite"></div>
        </form>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
